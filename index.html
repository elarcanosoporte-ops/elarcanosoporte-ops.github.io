<title>Llave Del Arcano | Revelando lo oculto</title>

<style>
/* ========== FUENTES (CDN fontsource) ========== */
@font-face{font-family:'Grenze Gotisch';font-style:normal;font-weight:700;src:url(https://cdn.jsdelivr.net/fontsource/fonts/grenze-gotisch@latest/latin-700-normal.woff2) format('woff2');}
@font-face{font-family:'Cinzel';font-style:normal;font-weight:400;src:url(https://cdn.jsdelivr.net/fontsource/fonts/cinzel@latest/latin-400-normal.woff2) format('woff2');}
@font-face{font-family:'Cinzel';font-style:normal;font-weight:600;src:url(https://cdn.jsdelivr.net/fontsource/fonts/cinzel@latest/latin-600-normal.woff2) format('woff2');}
@font-face{font-family:'Cinzel';font-style:normal;font-weight:700;src:url(https://cdn.jsdelivr.net/fontsource/fonts/cinzel@latest/latin-700-normal.woff2) format('woff2');}

/* ========== VARIABLES ROJO / NEGRO ========== */
:root{
  --negro:#050203;
  --negro-2:#0d0405;
  --sangre:#6d0c0c;
  --carmesi:#a31212;
  --brasa:#ff4b3e;
  --brasa-suave:rgba(255,75,62,.55);
  --oro-1:#f7e3b4;
  --oro-2:#d9a75f;
  --oro-3:#96622e;
  --tinta:#f2e7d8;
  --tinta-dim:#c9988c;
  --linea:rgba(255,75,62,.28);
  --panel:rgba(12,4,5,.66);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--negro);
  color:var(--tinta);
  font-family:'Cinzel',Georgia,'Times New Roman',serif;
  min-height:100vh;
  overflow-x:hidden;
}
::selection{background:var(--carmesi);color:#fff}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-track{background:#0a0304}
::-webkit-scrollbar-thumb{background:#4a0d0d;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#7a1414}

/* ========== ESCENA DE FONDO (SVG gótico) ========== */
.scene{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block}
.moon-halo{animation:halo 7s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.45}50%{opacity:.8}}
.star{animation:twinkle 4s ease-in-out infinite}
.star:nth-child(odd){animation-delay:1.4s}
.star:nth-child(3n){animation-duration:6s;animation-delay:2.2s}
@keyframes twinkle{0%,100%{opacity:.85}50%{opacity:.2}}

/* Capas de atmósfera */
.overlay{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 34% at 50% 12%, rgba(255,45,32,.16), transparent 70%),
    linear-gradient(180deg, rgba(5,2,3,.30) 0%, rgba(5,2,3,.62) 45%, rgba(4,2,2,.90) 100%);
}
.mist{
  position:fixed;left:-20%;right:-20%;bottom:-6%;height:46vh;z-index:1;pointer-events:none;
  background:
    radial-gradient(50% 62% at 30% 72%, rgba(150,22,18,.20), transparent 70%),
    radial-gradient(46% 56% at 72% 60%, rgba(120,15,15,.16), transparent 70%);
  filter:blur(14px);
  animation:mist 26s ease-in-out infinite alternate;
}
@keyframes mist{from{transform:translateX(-3%)}to{transform:translateX(3%)}}
#embers{position:fixed;inset:0;z-index:1;pointer-events:none}
.vignette{position:fixed;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 220px 60px rgba(0,0,0,.92)}

/* Runas flotantes decorativas */
.rune-float{
  position:fixed;z-index:1;color:var(--brasa);opacity:.16;pointer-events:none;
  font-size:1.4rem;text-shadow:0 0 12px rgba(255,60,40,.9);
  animation:floatRune 11s ease-in-out infinite alternate;
}
@keyframes floatRune{from{transform:translateY(-12px) rotate(-6deg)}to{transform:translateY(14px) rotate(7deg)}}

/* ========== CONTENIDO ========== */
main{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;
  padding:52px 20px 44px;min-height:100vh;
}
.rise{opacity:0;transform:translateY(20px);animation:rise .9s cubic-bezier(.16,.8,.3,1) forwards}
.d1{animation-delay:.08s}.d2{animation-delay:.2s}.d3{animation-delay:.32s}
.d4{animation-delay:.46s}.d5{animation-delay:.6s}.d6{animation-delay:.74s}
@keyframes rise{to{opacity:1;transform:none}}

/* Avatar + anillo de runas */
.avatar-wrap{position:relative;width:172px;height:172px;display:grid;place-items:center;margin-bottom:18px}
.rune-ring{position:absolute;inset:0;width:100%;height:100%;animation:spin 46s linear infinite;overflow:visible}
.rune-ring text{fill:var(--brasa);font-size:13px;filter:drop-shadow(0 0 5px rgba(255,60,40,.95))}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar-wrap:hover .rune-ring{animation-duration:12s}
.avatar{
  width:128px;height:128px;border-radius:50%;object-fit:cover;display:block;
  border:3px solid #2a0808;background:#0a0304;
  box-shadow:0 0 0 3px rgba(255,60,45,.35), 0 0 34px rgba(255,45,35,.38), inset 0 0 18px rgba(0,0,0,.8);
  transition:transform .35s ease, box-shadow .35s ease;
}
.avatar-wrap:hover .avatar{
  transform:scale(1.05);
  box-shadow:0 0 0 4px rgba(255,70,50,.55), 0 0 52px rgba(255,50,38,.55), inset 0 0 18px rgba(0,0,0,.8);
}

/* Nombre y lema */
.name{
  font-family:'Grenze Gotisch','Cinzel',serif;font-weight:700;
  font-size:clamp(2.5rem,9vw,3.6rem);line-height:1.05;text-align:center;
  background:linear-gradient(180deg,var(--oro-1) 0%,var(--oro-2) 55%,var(--oro-3) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,60,40,.55)) drop-shadow(0 2px 26px rgba(255,40,30,.35));
  animation:flicker 8s infinite;
  letter-spacing:.02em;
}
@keyframes flicker{
  0%,100%{opacity:1}91%{opacity:1}92%{opacity:.78}93%{opacity:1}95%{opacity:.88}96%{opacity:1}
}
.tagline{
  margin-top:10px;text-align:center;text-transform:uppercase;
  font-size:clamp(.6rem,2.6vw,.76rem);font-weight:600;letter-spacing:.24em;
  color:#e6bfae;text-shadow:0 0 12px rgba(255,60,40,.4);
}
.divider{display:flex;align-items:center;gap:12px;width:min(340px,80%);margin:20px auto 4px}
.divider .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--brasa-suave))}
.divider .line:last-child{background:linear-gradient(90deg,var(--brasa-suave),transparent)}
.divider .gem{color:var(--brasa);font-size:.95rem;text-shadow:0 0 10px rgba(255,60,40,.9);animation:gemPulse 3.4s ease-in-out infinite}
@keyframes gemPulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}

/* ========== PANEL DE ENLACES ========== */
.panel{
  position:relative;width:100%;max-width:460px;margin-top:24px;
  background:var(--panel);border:1px solid var(--linea);border-radius:16px;
  padding:26px 22px 28px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 24px 60px -24px rgba(0,0,0,.9), inset 0 0 60px rgba(120,12,10,.12);
  display:flex;flex-direction:column;gap:14px;
}
.panel::before,.panel::after{content:'';position:absolute;width:26px;height:26px;pointer-events:none}
.panel::before{top:-2px;left:-2px;border-top:2px solid var(--brasa-suave);border-left:2px solid var(--brasa-suave);border-top-left-radius:10px}
.panel::after{bottom:-2px;right:-2px;border-bottom:2px solid var(--brasa-suave);border-right:2px solid var(--brasa-suave);border-bottom-right-radius:10px}
.panel-title{
  display:flex;align-items:center;gap:10px;justify-content:center;
  font-size:.62rem;font-weight:700;letter-spacing:.34em;text-transform:uppercase;
  color:#b76b6b;margin-bottom:4px;
}
.panel-title::before,.panel-title::after{content:'';width:34px;height:1px;background:rgba(255,75,62,.35)}

/* Botones de enlace */
.link-btn{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;
  padding:14px 16px;border-radius:12px;text-decoration:none;cursor:pointer;
  background:linear-gradient(180deg, rgba(34,9,10,.88), rgba(13,4,5,.92));
  border:1px solid #571111;color:var(--tinta);
  transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease, background .25s ease;
  -webkit-tap-highlight-color:transparent;
}
.link-btn::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 32%,rgba(255,95,70,.16) 50%,transparent 68%);
  transform:translateX(-130%);transition:transform .7s ease;
}
.link-btn:hover::after,.link-btn:focus-visible::after{transform:translateX(130%)}
.link-btn:hover,.link-btn:focus-visible{
  transform:translateY(-3px);border-color:var(--brasa);
  box-shadow:0 12px 32px -12px rgba(255,50,40,.5), 0 0 24px rgba(255,45,35,.18), inset 0 0 0 1px rgba(255,60,45,.35);
  background:linear-gradient(180deg, rgba(52,12,12,.92), rgba(20,5,6,.95));
}
.link-btn:focus-visible{outline:2px solid var(--brasa);outline-offset:3px}
.link-btn:active{transform:translateY(-1px) scale(.99)}
.icon{
  width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%, #3a0d0c, #160505 72%);
  border:1px solid rgba(255,75,62,.35);
  box-shadow:inset 0 0 12px rgba(255,60,45,.28);
  transition:box-shadow .25s ease;
}
.link-btn:hover .icon{box-shadow:inset 0 0 16px rgba(255,70,50,.5), 0 0 14px rgba(255,60,40,.45)}
.icon svg{width:20px;height:20px;stroke:#ff6a58;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(255,70,50,.85))}
.icon svg.filled{fill:#ff6a58;stroke:none}
.label{flex:1;display:flex;flex-direction:column;gap:3px;text-align:left}
.label .t{font-weight:700;font-size:.98rem;letter-spacing:.08em;text-transform:uppercase}
.label .s{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-dim)}
.go{opacity:.45;transition:opacity .25s ease, transform .25s ease;color:var(--brasa)}
.go svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:block}
.link-btn:hover .go{opacity:1;transform:translateX(4px)}

/* Pie */
footer{margin-top:30px;text-align:center;color:#7d4a44;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;line-height:2}
footer .syms{color:var(--brasa);opacity:.7;font-size:.8rem;letter-spacing:.6em;text-shadow:0 0 10px rgba(255,60,40,.6)}

/* Toast "enlace copiado" */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:50;
  background:rgba(24,6,7,.95);border:1px solid var(--brasa);color:var(--tinta);
  padding:10px 22px;border-radius:999px;font-size:.7rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  box-shadow:0 0 26px rgba(255,50,40,.4);opacity:0;pointer-events:none;transition:opacity .3s ease, transform .3s ease;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:480px){
  main{padding:40px 16px 36px}
  .panel{padding:22px 16px 24px}
  .rune-float{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rise{opacity:1;transform:none}
}
</style>
</head>

<script>
/* ========== BRASAS FLOTANTES ========== */
(function(){
  var cvs = document.getElementById('embers');
  var ctx = cvs.getContext('2d');
  var W, H, parts = [];
  function resize(){ W = cvs.width = window.innerWidth; H = cvs.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  var N = Math.min(80, Math.floor(window.innerWidth / 16));
  function make(init){
    return {
      x: Math.random() * W,
      y: init ? Math.random() * H : H + 12,
      r: Math.random() * 1.9 + .6,
      s: Math.random() * .65 + .22,
      d: Math.random() * Math.PI * 2,
      w: Math.random() * .5 + .18,
      a: Math.random() * .45 + .22,
      p: Math.random() * Math.PI * 2,
      f: Math.random() * .12 + .04
    };
  }
  for (var i = 0; i < N; i++) parts.push(make(true));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tick(){
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < parts.length; i++){
      var p = parts[i];
      p.y -= p.s; p.d += .012; p.x += Math.sin(p.d) * p.w * .5; p.p += p.f;
      if (p.y < -14){ parts[i] = make(false); continue; }
      var al = p.a * (0.55 + 0.45 * Math.sin(p.p));
      var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
      g.addColorStop(0, 'rgba(255,140,90,' + al + ')');
      g.addColorStop(.4, 'rgba(255,55,38,' + (al * .5) + ')');
      g.addColorStop(1, 'rgba(255,40,30,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, 6.2832); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(tick);
  }
  if (!reduce) tick(); else { /* dibuja un solo frame estático */ tickOnce(); }
  function tickOnce(){
    ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation='lighter';
    for (var i=0;i<parts.length;i++){ var p=parts[i];
      var g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
      g.addColorStop(0,'rgba(255,140,90,'+p.a+')'); g.addColorStop(1,'rgba(255,40,30,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*4,0,6.2832); ctx.fill(); }
  }
})();

/* ========== COMPARTIR (copiar URL) ========== */
(function(){
  var btn = document.getElementById('shareBtn');
  var toast = document.getElementById('toast');
  var timer = null;
  btn.addEventListener('click', function(){
    var url = window.location.href;
    function ok(){
      toast.classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(function(){ toast.classList.remove('show'); }, 1900);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(ok).catch(fallback);
    } else fallback();
    function fallback(){
      var t = document.createElement('textarea');
      t.value = url; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); } catch(e){}
      t.remove(); ok();
    }
  });
})();

/* ========== AÑO DINÁMICO ========== */
document.getElementById('year').textContent = new Date().getFullYear();
</script>
